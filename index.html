<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Skull King — Contador de Puntos</title>
  <meta name="description" content="Contador de puntos, estadísticas y manual interactivo para Skull King. Desarrollado por Franco Ezequiel Amadio — Versión original: Agosto 2026." />
  <meta name="author" content="Franco Ezequiel Amadio" />
  <meta name="theme-color" content="#2f241a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="icon" type="image/png" href="./archivos/iconos/favicon.png" />
  <link rel="apple-touch-icon" href="./archivos/iconos/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body >
  <div id="root"></div>
  <script>
    // Si la app no llega a dibujarse (navegador viejo, archivo que no cargó), muestra el motivo en vez de quedar en marrón.
    (function () {
      var ultimo = '';
      window.addEventListener('error', function (e) { ultimo = (e && e.message) || ultimo; });
      window.addEventListener('unhandledrejection', function (e) { ultimo = String((e && e.reason && e.reason.message) || (e && e.reason) || ultimo); });
      setTimeout(function () {
        var raiz = document.getElementById('root');
        if (!raiz || raiz.childNodes.length) return;
        raiz.innerHTML = '<div style="min-height:100vh;background:#2f241a;color:#fff;padding:24px;font-family:system-ui,sans-serif;display:flex;flex-direction:column;gap:14px;justify-content:center">' +
          '<h1 style="font-size:22px">La app no pudo abrir</h1>' +
          '<p style="opacity:.85">Probá abrirla en Chrome o Safari (no desde WhatsApp u otra app) y que el navegador esté actualizado.</p>' +
          '<pre style="white-space:pre-wrap;font-size:12px;background:rgba(0,0,0,.35);padding:10px;border-radius:8px">' + String(ultimo || 'Sin detalle de error').slice(0, 300).replace(/</g, '&lt;') + '</pre>' +
          '<button onclick="location.reload()" style="padding:14px;border-radius:12px;border:0;font-weight:700;font-size:16px">Recargar</button></div>';
      }, 8000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
